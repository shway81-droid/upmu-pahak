name: 익명화 검사

# 공개 저장소라 실제 학교명·동료 이름이 한 번 올라가면 되돌리기 어렵다.
# 그래서 push 될 때마다 기계가 한 번 더 본다.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 예시에 실제 값이 들어갔는지 확인
        run: python scripts/check_anonymized.py
